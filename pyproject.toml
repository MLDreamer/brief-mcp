[project]
name = "brief-mcp"
version = "0.1.0"
description = "AI-powered meeting prep intelligence — know everyone in the room before you walk in"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "meeting", "ai", "productivity", "calendar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "fastmcp>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "cachetools>=5.0",
    "python-dotenv>=1.0",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pytest-mock>=3.14",
]

[project.scripts]
brief-mcp = "brief_mcp.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/brief-mcp"
Repository = "https://github.com/yourusername/brief-mcp"
Issues = "https://github.com/yourusername/brief-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brief_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["brief_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
